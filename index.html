<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MERIDIAN — Command Surface</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030509;
      --surface: rgba(5, 11, 22, 0.93);
      --border: rgba(0, 210, 185, 0.22);
      --border-hi: rgba(0, 210, 185, 0.65);
      --accent: #00D2B9;
      --accent-glow: rgba(0, 210, 185, 0.28);
      --a2: #FF4B6E;
      --a3: #FFB020;
      --a4: #7B6FE8;
      --text: #BDD6E6;
      --dim: rgba(189, 214, 230, 0.42);
      --orb: 'Orbitron', monospace;
      --mono: 'Space Mono', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--mono);
      color: var(--text);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #bg {
      position: fixed; inset: 0; z-index: 0;
      width: 100%; height: 100%;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 2;
      pointer-events: none;
      background: repeating-linear-gradient(0deg,
        transparent 0, transparent 3px,
        rgba(0,0,0,0.055) 3px, rgba(0,0,0,0.055) 4px);
    }
    #surface {
      position: relative; z-index: 1;
      display: flex; align-items: stretch;
      width: 100vw; height: 100vh;
      padding: 1.5vh 1vw; gap: 0.8vw;
      flex-wrap: wrap;
      align-content: flex-start;
    }

    /* ── PANELS ── */
    .panel {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.45s ease, transform 0.45s ease, border-color 0.25s, box-shadow 0.3s ease;
      backdrop-filter: blur(14px);
      user-select: none;
      cursor: grab;
    }
    .panel.on { opacity: 1; transform: translateY(0); }
    .panel:hover { border-color: rgba(0,210,185,0.45); }
    .panel.dragging {
      cursor: grabbing;
      box-shadow: 0 0 40px var(--accent-glow), 0 0 80px var(--accent-glow);
      opacity: 0.95;
      z-index: 1000;
    }
    .panel.fullscreen-mode {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      z-index: 999 !important;
      animation: trekkieExpand 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .panel.compact-fullscreen {
      animation: trekkieMinimize 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes trekkieExpand {
      0% {
        border-radius: inherit;
        box-shadow: 0 0 20px var(--accent-glow);
      }
      50% {
        box-shadow: 0 0 80px var(--accent-glow), 0 0 160px rgba(0, 210, 185, 0.4);
      }
      100% {
        border-radius: 0;
        box-shadow: 0 0 40px var(--accent-glow);
      }
    }
    @keyframes trekkieMinimize {
      0% { transform: scale(1) !important; opacity: 1 !important; }
      50% { box-shadow: 0 0 60px var(--accent-glow), inset 0 0 40px rgba(0, 210, 185, 0.1); }
      100% { transform: scale(1) !important; opacity: 0.7 !important; }
    }

    /* Corner accents */
    .panel::before, .panel::after {
      content: ''; position: absolute;
      width: 9px; height: 9px;
      z-index: 10; pointer-events: none;
    }
    .panel::before { top: 5px; left: 5px;
      border-top: 1.5px solid var(--accent);
      border-left: 1.5px solid var(--accent); }
    .panel::after { bottom: 5px; right: 5px;
      border-bottom: 1.5px solid var(--accent);
      border-right: 1.5px solid var(--accent); }

    /* Panel header */
    .ph {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 1vh 1.3vh;
      border-bottom: 1px solid var(--border);
      font-family: var(--orb); font-size: 0.85vh;
      letter-spacing: 0.32em; color: var(--accent);
      flex-shrink: 0;
      cursor: grab;
      touch-action: none;
    }
    .ph:active { cursor: grabbing; }
    .ph .ind {
      display: flex; align-items: center;
      gap: 0.5vw; font-size: 0.75vh; color: var(--dim);
      font-family: var(--mono);
    }
    .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent);
      animation: pdot 2.2s ease-in-out infinite;
    }
    @keyframes pdot {
      0%,100%{opacity:1;transform:scale(1)}
      50%{opacity:0.35;transform:scale(0.65)}
    }
    .pb { flex: 1; overflow: hidden; position: relative; }
    .panel-fs-btn {
      width: 1.8rem; height: 1.8rem;
      background: rgba(0, 210, 185, 0.1);
      border: 1px solid var(--accent);
      border-radius: 2px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem;
      color: var(--accent);
      transition: all 0.3s ease;
      flex-shrink: 0;
      margin-left: 0.8vw;
      opacity: 0;
      transform: scale(0.8);
    }
    .panel:hover .panel-fs-btn {
      opacity: 1;
      transform: scale(1);
    }
    .panel-fs-btn:hover {
      background: rgba(0, 210, 185, 0.25);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Panel widths - responsive */
    #p-clock   { width: 13vw; flex-shrink: 0; min-width: 160px; }
    #p-weather { width: 16vw; flex-shrink: 0; min-width: 180px; }
    #p-hub     { flex: 1; min-width: 300px; }
    #p-tasks   { width: 16vw; flex-shrink: 0; min-width: 180px; }
    #p-media   { width: 12vw; flex-shrink: 0; min-width: 140px; }
    #p-sys     { width: 13vw; flex-shrink: 0; min-width: 160px; }

    /* ══════════════════════════════
       CLOCK PANEL
    ══════════════════════════════ */
    .clock-body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; gap: 1.2vh; padding: 1.5vh;
    }
    .t-hhmm {
      font-family: var(--orb); font-weight: 900;
      font-size: clamp(3rem, 8vh, 10rem); letter-spacing: 0.04em;
      color: #fff; line-height: 1;
      text-shadow: 0 0 28px var(--accent), 0 0 55px var(--accent-glow);
    }
    .t-ss {
      font-family: var(--orb); font-size: clamp(1.2rem, 3vh, 3.5rem);
      color: var(--accent); letter-spacing: 0.2em;
    }
    .analog-svg { width: clamp(6rem, 11vh, 14rem); height: clamp(6rem, 11vh, 14rem); flex-shrink: 0; }
    .t-date {
      font-size: clamp(0.7rem, 0.95vh, 1.2rem); letter-spacing: 0.22em;
      color: var(--dim); text-align: center; line-height: 1.8;
    }
    .day-prog {
      width: 88%; display: flex; flex-direction: column; gap: 0.5vh;
    }
    .day-prog-lbl {
      display: flex; justify-content: space-between;
      font-size: clamp(0.6rem, 0.85vh, 1rem); color: var(--dim); letter-spacing: 0.18em;
    }
    .day-prog-track {
      height: 3px; background: rgba(255,255,255,0.08);
      border-radius: 2px; overflow: hidden;
    }
    .day-prog-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--a4), var(--accent));
    }

    /* ══════════════════════════════
       WEATHER PANEL
    ══════════════════════════════ */
    .wx-body {
      display: flex; flex-direction: column;
      height: 100%; padding: 1.3vh 1.6vh; gap: 1vh;
    }
    .wx-loc {
      font-size: clamp(0.75rem, 0.95vh, 1.1rem); color: var(--dim);
      letter-spacing: 0.2em;
      display: flex; align-items: center; gap: 0.5vw;
    }
    .wx-loc::before { content: '⊕'; color: var(--accent); }
    .wx-main {
      display: flex; align-items: flex-end; gap: 1vh;
    }
    .wx-temp {
      font-family: var(--orb); font-weight: 900;
      font-size: clamp(3rem, 8vh, 10rem); color: #fff; line-height: 1;
    }
    .wx-unit {
      font-family: var(--orb); font-size: clamp(1.2rem, 2.5vh, 3rem);
      color: var(--dim); padding-bottom: 0.8vh;
    }
    .wx-emoji { font-size: clamp(3rem, 5.5vh, 7rem); line-height: 1; }
    .wx-cond {
      font-size: clamp(0.8rem, 1.1vh, 1.3rem); letter-spacing: 0.25em; color: var(--accent);
    }
    .wx-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.6vh;
    }
    .wx-stat {
      font-size: clamp(0.7rem, 0.9vh, 1rem); color: var(--dim);
    }
    .wx-stat b { color: var(--text); font-weight: 700; font-style: normal; }
    .wx-fc {
      display: flex; gap: 0.4vw;
      border-top: 1px solid var(--border);
      padding-top: 0.8vh; margin-top: auto;
    }
    .fc-day {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; gap: 0.4vh;
      font-size: clamp(0.65rem, 0.85vh, 1rem); color: var(--dim);
    }
    .fc-day .fc-dn { letter-spacing: 0.15em; color: var(--accent); }
    .fc-day .fc-ic { font-size: clamp(1.2rem, 2vh, 2.5rem); }
    .fc-day .fc-temps { display: flex; gap: 0.3vw; font-size: clamp(0.6rem, 0.8vh, 0.95rem); }
    .fc-day .fc-hi { color: var(--text); }

    /* ══════════════════════════════
       HUB (CENTER)
    ══════════════════════════════ */
    .hub-tabs {
      display: flex; border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .hub-tab {
      flex: 1; padding: 1rem;
      background: transparent;
      border: none; color: var(--dim);
      font-family: var(--orb);
      font-size: clamp(0.85rem, 1.1vh, 1.3rem);
      letter-spacing: 0.2em;
      cursor: pointer;
      transition: all 0.3s ease;
      border-bottom: 2px solid transparent;
    }
    .hub-tab:hover { color: var(--accent); }
    .hub-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .hub-body { flex: 1; overflow: auto; padding: 1.2vh; }

    /* ══════════════════════════════
       TASKS PANEL
    ══════════════════════════════ */
    .task-header { padding: 0.8vh 1.1vh; border-bottom: 1px solid var(--border); }
    .task-cnt { font-size: clamp(0.85rem, 1.1vh, 1.3rem); color: var(--accent); font-weight: 700; }
    .task-stat { font-size: clamp(0.75rem, 0.95vh, 1.1rem); color: var(--dim); margin-top: 0.3vh; }
    .task-cmpl { font-size: clamp(0.7rem, 0.85vh, 1rem); color: var(--a3); margin-top: 0.2vh; }
    .task-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.4vh; padding: 0.8vh; }
    .task-item {
      padding: 0.9vh 0.8vh;
      background: rgba(0, 210, 185, 0.06);
      border: 1px solid var(--border);
      border-radius: 2px;
      display: flex;
      align-items: center;
      gap: 0.6vw;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: clamp(0.75rem, 0.95vh, 1.1rem);
    }
    .task-item:hover { background: rgba(0, 210, 185, 0.12); border-color: var(--border-hi); }
    .task-item.done {
      opacity: 0.5;
      text-decoration: line-through;
    }
    .task-chk {
      width: 18px; height: 18px;
      border: 1.5px solid var(--accent);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 0.9rem;
      color: var(--accent);
    }
    .task-txt { flex: 1; }
    .task-pri, .task-del {
      width: 1.6rem; height: 1.6rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--dim);
      border-radius: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .task-pri:hover, .task-del:hover { color: var(--accent); border-color: var(--accent); }
    .task-input {
      width: 100%;
      padding: 0.7vh 0.8vh;
      background: rgba(0, 210, 185, 0.06);
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--text);
      font-family: var(--mono);
      font-size: clamp(0.75rem, 0.95vh, 1.1rem);
      margin-bottom: 0.6vh;
      transition: border 0.2s ease;
    }
    .task-input:focus {
      outline: none;
      border-color: var(--border-hi);
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .task-btn {
      width: 100%;
      padding: 0.8vh;
      background: rgba(0, 210, 185, 0.15);
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 2px;
      font-family: var(--orb);
      font-size: clamp(0.8rem, 1vh, 1.2rem);
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 700;
    }
    .task-btn:hover {
      background: rgba(0, 210, 185, 0.25);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    /* ══════════════════════════════
       MEDIA PANEL
    ══════════════════════════════ */
    .med-body { display: flex; flex-direction: column; height: 100%; padding: 1vh; gap: 0.8vh; }
    .med-canvas { flex: 1; border: 1px solid var(--border); border-radius: 2px; background: rgba(0,0,0,0.3); }
    .med-vu { display: flex; gap: 0.2vh; height: 1.6rem; align-items: flex-end; }
    .vu-b { flex: 1; border-radius: 1px; background: var(--accent); transition: height 0.05s ease; }
    .med-info {
      font-size: clamp(0.7rem, 0.9vh, 1rem);
      color: var(--dim);
    }
    .med-info strong { color: var(--text); }
    .med-btns { display: flex; gap: 0.5vh; }
    .med-btn {
      flex: 1;
      padding: 0.7vh;
      background: rgba(0, 210, 185, 0.12);
      border: 1px solid var(--border);
      color: var(--accent);
      border-radius: 2px;
      font-family: var(--orb);
      font-size: clamp(0.75rem, 0.9vh, 1.05rem);
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
    }
    .med-btn:hover { background: rgba(0, 210, 185, 0.25); border-color: var(--accent); }

    /* ══════════════════════════════
       SYSTEM PANEL
    ══════════════════════════════ */
    .sys-body { height: 100%; overflow-y: auto; padding: 1vh; font-size: clamp(0.75rem, 0.95vh, 1.1rem); }
    .sys-row {
      display: flex;
      flex-direction: column;
      gap: 0.5vh;
      margin-bottom: 1vh;
    }
    .sys-lbl {
      display: flex;
      justify-content: space-between;
      color: var(--dim);
      font-size: clamp(0.75rem, 0.95vh, 1.1rem);
    }
    .sys-lbl span { color: var(--accent); }
    .sys-trk {
      height: 1.2rem;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }
    .sys-fill { height: 100%; transition: width 0.3s ease; }
    .sys-hr { border: none; height: 1px; background: var(--border); margin: 0.8vh 0; }
    .sys-rd {
      display: flex;
      justify-content: space-between;
      font-size: clamp(0.7rem, 0.9vh, 1rem);
      color: var(--dim);
      padding: 0.4vh 0;
    }
    .sys-rd span:first-child { color: var(--dim); }
    .sys-rd span:last-child { color: var(--text); font-weight: 600; }

    /* Modal for hub content */
    #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; }
    #modal.open { display: flex; }
    .modal-content { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 2vh; max-width: 80vw; max-height: 80vh; overflow: auto; }

    /* Theme buttons */
    .theme-row { display: flex; gap: 0.6vw; margin-bottom: 1.2vh; flex-wrap: wrap; }
    .thm-btn {
      padding: 0.7vh 1.2vh;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      color: var(--dim);
      border-radius: 2px;
      font-family: var(--orb);
      font-size: clamp(0.75rem, 0.95vh, 1.1rem);
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
    }
    .thm-btn:hover { border-color: var(--accent); color: var(--accent); }
    .thm-btn.active {
      background: rgba(0, 210, 185, 0.2);
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .news-item {
      padding: 1.2vh;
      border-left: 2px solid var(--accent);
      background: rgba(0, 210, 185, 0.06);
      margin-bottom: 0.8vh;
      border-radius: 2px;
    }
    .news-item h3 { font-size: clamp(0.9rem, 1.1vh, 1.3rem); color: var(--accent); margin-bottom: 0.4vh; }
    .news-item p { font-size: clamp(0.75rem, 0.95vh, 1.1rem); color: var(--dim); line-height: 1.5; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-hi); }

    @media (max-width: 1200px) {
      #surface { padding: 1vh 0.8vw; gap: 0.6vw; }
      #p-clock, #p-weather, #p-tasks, #p-media, #p-sys { width: auto; flex: 1 1 calc(50% - 0.4vw); min-width: 0; }
      #p-hub { min-width: 0; }
    }
    @media (max-width: 768px) {
      #surface { flex-wrap: wrap; }
      .panel { flex: 1 1 100%; width: 100% !important; }
    }
  </style>
</head>
<body>
<div id="bg"></div>
<div id="surface">
  <!-- CLOCK PANEL -->
  <div class="panel" id="p-clock">
    <div class="ph">
      <span>⏰ CHRONOMETER</span>
      <button class="panel-fs-btn" data-panel="p-clock" title="Fullscreen">⛶</button>
    </div>
    <div class="pb clock-body">
      <div class="t-hhmm" id="thhmm">--:--</div>
      <div class="t-ss" id="tss">--</div>
      <svg class="analog-svg" viewBox="0 0 100 100" id="analog-clock">
        <circle cx="50" cy="50" r="48" fill="none" stroke="rgba(0,210,185,0.15)" stroke-width="1"/>
        <circle cx="50" cy="50" r="3" fill="var(--accent)"/>
        <line id="hh" x1="50" y1="50" x2="50" y2="30" stroke="var(--text)" stroke-width="1.5" stroke-linecap="round"/>
        <line id="mm" x1="50" y1="50" x2="50" y2="15" stroke="var(--accent)" stroke-width="1" stroke-linecap="round"/>
        <line id="ss" x1="50" y1="50" x2="50" y2="10" stroke="var(--a2)" stroke-width="0.8" stroke-linecap="round"/>
      </svg>
      <div class="t-date">
        <div id="tdate">--/--/--</div>
        <div id="tdow">---</div>
      </div>
      <div class="day-prog">
        <div class="day-prog-lbl"><span>DAY</span><span id="dpct">0%</span></div>
        <div class="day-prog-track"><div class="day-prog-fill" id="dprog"></div></div>
      </div>
    </div>
  </div>

  <!-- WEATHER PANEL -->
  <div class="panel" id="p-weather">
    <div class="ph">
      <span>☁ WEATHER</span>
      <button class="panel-fs-btn" data-panel="p-weather" title="Fullscreen">⛶</button>
    </div>
    <div class="pb wx-body">
      <div class="wx-loc" id="wxloc">PETOSKEY, MI</div>
      <div class="wx-main">
        <div class="wx-emoji" id="wxemoji">🌤</div>
        <div>
          <div class="wx-temp" id="wxtemp">72</div>
          <div class="wx-unit">°F</div>
        </div>
      </div>
      <div class="wx-cond" id="wxcond">PARTLY CLOUDY</div>
      <div class="wx-grid">
        <div class="wx-stat">💧 <b id="wxhumid">65</b>%</div>
        <div class="wx-stat">🌪 <b id="wxwind">12</b> mph</div>
        <div class="wx-stat">🧭 <b id="wxdir">NW</b></div>
        <div class="wx-stat">🔽 <b id="wxpres">30.1</b> in</div>
      </div>
      <div class="wx-fc">
        <div class="fc-day"><div class="fc-dn">MON</div><div class="fc-ic">🌤</div><div class="fc-temps"><span class="fc-hi">75</span><span>62</span></div></div>
        <div class="fc-day"><div class="fc-dn">TUE</div><div class="fc-ic">☁</div><div class="fc-temps"><span class="fc-hi">68</span><span>58</span></div></div>
        <div class="fc-day"><div class="fc-dn">WED</div><div class="fc-ic">🌧</div><div class="fc-temps"><span class="fc-hi">65</span><span>55</span></div></div>
      </div>
    </div>
  </div>

  <!-- HUB (CENTER) -->
  <div class="panel" id="p-hub">
    <div class="ph">
      <span>◆ COMMAND HUB</span>
      <button class="panel-fs-btn" data-panel="p-hub" title="Fullscreen">⛶</button>
    </div>
    <div class="hub-tabs">

<script>
const $=(id)=>document.getElementById(id);
const clamp=(v,mn,mx)=>Math.max(mn,Math.min(mx,v));

/* ══════════════════════════════════════════════════════════
   PANEL DRAGGING & FULLSCREEN
══════════════════════════════════════════════════════════ */
let dragState = {
  panel: null,
  offsetX: 0,
  offsetY: 0,
  startX: 0,
  startY: 0,
  longPressTimer: null,
  isDragging: false,
};
let fullscreenPanel = null;

document.querySelectorAll('.ph').forEach(header => {
  header.addEventListener('touchstart', startDrag, { passive: false });
  header.addEventListener('mousedown', startDrag, { passive: false });
  header.addEventListener('touchmove', doDrag, { passive: false });
  header.addEventListener('mousemove', doDrag, { passive: false });
  header.addEventListener('touchend', endDrag);
  header.addEventListener('mouseup', endDrag);
});

function startDrag(e) {
  if (fullscreenPanel) return;
  const panel = e.currentTarget.closest('.panel');
  if (!panel) return;
  
  dragState.panel = panel;
  dragState.startX = e.touches ? e.touches[0].clientX : e.clientX;
  dragState.startY = e.touches ? e.touches[0].clientY : e.clientY;
  dragState.offsetX = 0;
  dragState.offsetY = 0;
  
  dragState.longPressTimer = setTimeout(() => {
    dragState.isDragging = true;
    panel.classList.add('dragging');
  }, 300);
}

function doDrag(e) {
  if (!dragState.isDragging || !dragState.panel) return;
  e.preventDefault();
  
  const currentX = e.touches ? e.touches[0].clientX : e.clientX;
  const currentY = e.touches ? e.touches[0].clientY : e.clientY;
  
  dragState.offsetX = currentX - dragState.startX;
  dragState.offsetY = currentY - dragState.startY;
  
  dragState.panel.style.transform = `translate(${dragState.offsetX}px, ${dragState.offsetY}px)`;
}

function endDrag() {
  if (dragState.longPressTimer) clearTimeout(dragState.longPressTimer);
  
  if (dragState.isDragging && dragState.panel) {
    dragState.panel.style.transform = '';
    dragState.panel.classList.remove('dragging');
    dragState.isDragging = false;
  }
  
  dragState.panel = null;
}

// Fullscreen buttons
document.querySelectorAll('.panel-fs-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const panelId = btn.dataset.panel;
    const panel = $(panelId);
    
    if (fullscreenPanel) {
      exitFullscreen();
    } else {
      enterFullscreen(panel);
    }
  });
});

function enterFullscreen(panel) {
  fullscreenPanel = panel;
  panel.classList.add('fullscreen-mode');
  
  document.querySelectorAll('.panel').forEach(p => {
    if (p !== panel) {
      p.classList.add('compact-fullscreen');
      p.style.opacity = '0.4';
      p.style.pointerEvents = 'none';
    }
  });
}

function exitFullscreen() {
  if (fullscreenPanel) {
    fullscreenPanel.classList.remove('fullscreen-mode');
    
    document.querySelectorAll('.panel').forEach(p => {
      if (p !== fullscreenPanel) {
        p.classList.remove('compact-fullscreen');
        p.style.opacity = '1';
        p.style.pointerEvents = 'auto';
      }
    });
    
    fullscreenPanel = null;
  }
}

// Close fullscreen with ESC
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && fullscreenPanel) {
    exitFullscreen();
  }
});

/* ══════════════════════════════════════════════════════════
   CLOCK UPDATES
══════════════════════════════════════════════════════════ */
function updateClock(){
  const now=new Date();
  const h=now.getHours(), m=now.getMinutes(), s=now.getSeconds();
  const hm=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  $('thhmm').textContent=hm;
  $('tss').textContent=String(s).padStart(2,'0');
  
  const ang=(v,max)=>(v/max)*360;
  $('hh').style.transform=`rotate(${ang(h%12,12)+ang(m,720)}deg)`;
  $('mm').style.transform=`rotate(${ang(m,60)+ang(s,3600)}deg)`;
  $('ss').style.transform=`rotate(${ang(s,60)}deg)`;
  
  const dow=['SUN','MON','TUE','WED','THU','FRI','SAT'][now.getDay()];
  const date=String(now.getMonth()+1).padStart(2,'0')+'/'+String(now.getDate()).padStart(2,'0')+'/'+String(now.getFullYear()).slice(-2);
  $('tdate').textContent=date;
  $('tdow').textContent=dow;
  
  const start=new Date(now.getFullYear(),0,1);
  const end=new Date(now.getFullYear()+1,0,1);
  const dpct=Math.round((now-start)/(end-start)*100);
  $('dpct').textContent=dpct+'%';
  $('dprog').style.width=dpct+'%';
}
setInterval(updateClock,500); updateClock();

/* ══════════════════════════════════════════════════════════
   WEATHER (SIMULATED)
══════════════════════════════════════════════════════════ */
function loadWeather(){
  const temps=[68,72,75,70,65,60,58,72];
  const temp=temps[Math.floor(Math.random()*temps.length)];
  const humid=clamp(Math.random()*100,40,90);
  const wind=clamp(Math.random()*20,5,18);
  const dirs=['N','NE','E','SE','S','SW','W','NW'];
  const dir=dirs[Math.floor(Math.random()*dirs.length)];
  const pres=(30+Math.random()*0.3).toFixed(1);
  const emojis=['🌤','☀','⛅','☁','🌥'];
  const emoji=emojis[Math.floor(Math.random()*emojis.length)];
  
  $('wxtemp').textContent=Math.round(temp);
  $('wxhumid').textContent=Math.round(humid);
  $('wxwind').textContent=Math.round(wind);
  $('wxdir').textContent=dir;
  $('wxpres').textContent=pres;
  $('wxemoji').textContent=emoji;
}
loadWeather();

/* ══════════════════════════════════════════════════════════
   HUB TABS
══════════════════════════════════════════════════════════ */
const hubTabs={'l':'Latest News','n':'Personal Notes','s':'Settings'};
const hubContent={
  l:`<div style="display:flex;flex-direction:column;gap:1.2vh;">
      <div class="news-item"><h3>✦ ALERT</h3><p>System optimization complete. All protocols nominal.</p></div>
      <div class="news-item"><h3>◆ UPDATE</h3><p>New command interface deployed. Enhanced responsiveness across all terminals.</p></div>
      <div class="news-item"><h3>▲ NOTICE</h3><p>Scheduled maintenance windows now available. Plan accordingly.</p></div>
     </div>`,
  n:`<div style="display:flex;flex-direction:column;gap:1.2vh;">
      <div class="news-item"><h3>⊕ ENTRY 1</h3><p>Time invested in refinement yields exponential returns. Focus on the work in front of you.</p></div>
      <div class="news-item"><h3>⊕ ENTRY 2</h3><p>Small faithfulness matters. The universe rewards consistent dedication.</p></div>
      <div class="news-item"><h3>⊕ ENTRY 3</h3><p>Command integrity restored. Ready for next phase of operations.</p></div>
     </div>`,
  s:`<div style="padding:1.2vh 0;">
      <div style="margin-bottom:1.5vh;">
        <div style="font-size:clamp(0.85rem,1.1vh,1.3rem);color:var(--accent);margin-bottom:0.8vh;font-weight:700;">THEME</div>
        <div class="theme-row">
          <button class="thm-btn active" data-theme="teal">TEAL</button>
          <button class="thm-btn" data-theme="amber">AMBER</button>
          <button class="thm-btn" data-theme="violet">VIOLET</button>
          <button class="thm-btn" data-theme="rose">ROSE</button>
        </div>
      </div>
      <div style="font-size:clamp(0.75rem,0.95vh,1.1rem);color:var(--dim);line-height:1.6;">
        <strong>KEYBOARD:</strong><br>
        ALT+1: Latest<br>
        ALT+2: Notes<br>
        ALT+3: Settings<br>
        ALT+R: Refresh<br>
        ESC: Exit Fullscreen
      </div>
     </div>`
};

document.querySelectorAll('.hub-tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.hub-tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    const tabKey=tab.dataset.tab;
    $('hub-body').innerHTML=hubContent[tabKey];
  });
});
$('hub-body').innerHTML=hubContent['l'];

/* ══════════════════════════════════════════════════════════
   TASKS
══════════════════════════════════════════════════════════ */
let tasks=JSON.parse(localStorage.getItem('meridian_tasks'))||[
  {text:'REVIEW COMMAND PROTOCOLS',done:false,p:0,id:1},
  {text:'OPTIMIZE SIGNAL PROCESSING',done:false,p:1,id:2},
  {text:'VERIFY SYSTEM DIAGNOSTICS',done:true,p:0,id:3}
];
function saveTasks(){ localStorage.setItem('meridian_tasks',JSON.stringify(tasks)); }
function renderTasks(){
  const list=$('tasklist'), active=tasks.filter(t=>!t.done), done=tasks.filter(t=>t.done);
  list.innerHTML='';
  active.concat(done).forEach((t,ri)=>{
    const el=document.createElement('div');
    el.className='task-item'+(t.done?' done':'');
    el.innerHTML=`<div class="task-chk">${t.done?'✓':''}</div><div class="task-txt">${t.text}</div><button class="task-pri" title="Priority">⚡</button><button class="task-del" title="Delete">✕</button>`;
    el.querySelector('.task-chk').addEventListener('click',e=>{
      e.stopPropagation(); tasks[tasks.indexOf(t)].done=!t.done; saveTasks(); renderTasks();
    });
    el.querySelector('.task-pri').addEventListener('click',e=>{
      e.stopPropagation(); tasks[tasks.indexOf(t)].p=((tasks[tasks.indexOf(t)].p||0)+1)%3; saveTasks(); renderTasks();
    });
    el.querySelector('.task-del').addEventListener('click',e=>{
      e.stopPropagation(); tasks.splice(tasks.indexOf(t),1); saveTasks(); renderTasks();
    });
    list.appendChild(el);
  });
  const ac=active.length, dc=done.length;
  $('tcnt').textContent=`${ac} ACTIVE`;
  $('tstats').textContent=ac===0?'ALL CLEAR':`${ac} PENDING`;
  $('tcmpl').textContent=dc>0?`${dc} DONE`:'';
}
function addTask(){
  const inp=$('tin'), t=inp.value.trim().toUpperCase();
  if(!t)return;
  tasks.unshift({text:t,done:false,p:0,id:Date.now()});
  saveTasks(); renderTasks(); inp.value='';
}
$('tadd').addEventListener('click',addTask);
$('tin').addEventListener('keydown',e=>{ if(e.key==='Enter')addTask(); });
renderTasks();

/* ══════════════════════════════════════════════════════════
   MEDIA / SIGNAL PANEL — audio-reactive visualizer
══════════════════════════════════════════════════════════ */
(function(){
  const cvs=$('mc'), ctx=cvs.getContext('2d');
  let audioCtx=null, analyser=null, dataArr=null;
  let active=false, ph=0;

  function resize(){ cvs.width=cvs.offsetWidth*devicePixelRatio; cvs.height=cvs.offsetHeight*devicePixelRatio; }
  resize(); window.addEventListener('resize',resize);

  const vw=$('vuwrap'), NUM=36, vuEls=[];
  for(let i=0;i<NUM;i++){
    const b=document.createElement('div'); b.className='vu-b';
    const hue=180-i*2;
    b.style.background=`hsl(${hue},75%,${45+i}%)`;
    vw.appendChild(b); vuEls.push(b);
  }

  async function initAudio(){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
      audioCtx=new(window.AudioContext||window.webkitAudioContext)();
      analyser=audioCtx.createAnalyser();
      analyser.fftSize=256;
      dataArr=new Uint8Array(analyser.frequencyBinCount);
      audioCtx.createMediaStreamSource(stream).connect(analyser);
      active=true; $('mstatus').textContent='MIC: ACTIVE — VISUALIZING';
    } catch(e){ $('mstatus').textContent='MIC: UNAVAILABLE'; }
  }

  $('mplay').addEventListener('click',()=>{ if(!active) initAudio(); });
  $('mprev').addEventListener('click',()=>document.dispatchEvent(new KeyboardEvent('keydown',{key:'MediaTrackPrevious',keyCode:177,bubbles:true})));
  $('mnext').addEventListener('click',()=>document.dispatchEvent(new KeyboardEvent('keydown',{key:'MediaTrackNext',keyCode:176,bubbles:true})));

  function draw(){
    const W=cvs.width, H=cvs.height;
    ctx.clearRect(0,0,W,H);
    if(active && analyser){ analyser.getByteFrequencyData(dataArr); }
    ph+=0.028;
    ctx.beginPath(); ctx.strokeStyle='rgba(0,210,185,0.65)'; ctx.lineWidth=1.6*devicePixelRatio;
    for(let i=0;i<80;i++){
      const x=(i/80)*W;
      let y;
      if(active && dataArr){ const di=Math.floor(i/80*dataArr.length); y=H/2-(dataArr[di]/255)*H*0.42; }
      else { y=H/2+Math.sin(i*0.14+ph)*H*0.28*(0.5+Math.sin(i*0.06+ph*0.7)*0.5); }
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
    ctx.beginPath(); ctx.strokeStyle='rgba(123,111,232,0.4)'; ctx.lineWidth=1*devicePixelRatio;
    for(let i=0;i<80;i++){
      const x=(i/80)*W;
      let y;
      if(active && dataArr){ const di=Math.floor(i/80*dataArr.length*0.55); y=H/2+(dataArr[di]/255)*H*0.3; }
      else { y=H/2-Math.sin(i*0.11-ph*1.4)*H*0.16; }
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
    vuEls.forEach((b,i)=>{
      let h;
      if(active && dataArr){ const di=Math.floor(i/NUM*dataArr.length*0.65); h=dataArr[di]/255*100; }
      else { h=(Math.sin(i*0.38+ph*2.2)+1)*22+4+Math.random()*6; }
      b.style.height=clamp(h,4,100)+'%';
    });
    if('mediaSession' in navigator && navigator.mediaSession.metadata){
      const meta=navigator.mediaSession.metadata;
      $('mtrack').textContent=meta.title||'UNKNOWN TRACK';
      $('martist').textContent=meta.artist||'UNKNOWN ARTIST';
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ══════════════════════════════════════════════════════════
   SYSTEM TELEMETRY
══════════════════════════════════════════════════════════ */
async function initSys(){
  let bat=null;
  try{ bat=await navigator.getBattery(); } catch(e){}
  const hw={
    cores:navigator.hardwareConcurrency||'N/A',
    mem:navigator.deviceMemory?(navigator.deviceMemory+' GB'):'N/A',
    conn:navigator.connection||navigator.mozConnection||navigator.webkitConnection||null,
    scr:`${screen.width}×${screen.height}`,
    cd:screen.colorDepth+'-BIT',
    plat:navigator.platform||'UNKNOWN',
  };
  function update(){
    const up=performance.now()/1000;
    const uh=Math.floor(up/3600), um=Math.floor((up%3600)/60), us=Math.floor(up%60);
    const upstr=uh>0?`${uh}H ${um}M ${us}S`:`${um}M ${us}S`;
    const bpct=bat?Math.round(bat.level*100):100;
    const bchg=bat?bat.charging:false;
    const bcolor=bpct>65?'var(--accent)':bpct>25?'var(--a3)':'var(--a2)';
    const net=hw.conn?(hw.conn.effectiveType||hw.conn.type||'CONNECTED').toUpperCase():
      (navigator.onLine?'ONLINE':'OFFLINE');
    let mu='--',mt='--';
    if(performance.memory){
      mu=(performance.memory.usedJSHeapSize/1048576).toFixed(0)+' MB';
      mt=(performance.memory.jsHeapSizeLimit/1048576).toFixed(0)+' MB';
    }
    $('sysbody').innerHTML=`
      <div class="sys-row">
        <div class="sys-lbl">BATTERY<span>${bpct}% ${bchg?'⚡':''}</span></div>
        <div class="sys-trk"><div class="sys-fill" style="width:${bpct}%;background:${bcolor}"></div></div>
      </div>
      <hr class="sys-hr">
      <div class="sys-rd"><span>NETWORK</span>${net}</div>
      <div class="sys-rd"><span>CPU CORES</span>${hw.cores}</div>
      <div class="sys-rd"><span>DEVICE RAM</span>${hw.mem}</div>
      <hr class="sys-hr">
      <div class="sys-rd"><span>JS HEAP</span>${mu} / ${mt}</div>
      <div class="sys-rd"><span>RESOLUTION</span>${hw.scr}</div>
      <div class="sys-rd"><span>COLOR DEPTH</span>${hw.cd}</div>
      <div class="sys-rd"><span>PLATFORM</span>${hw.plat.toUpperCase().substring(0,12)}</div>
      <hr class="sys-hr">
      <div class="sys-rd"><span>UPTIME</span>${upstr}</div>
      <div class="sys-rd"><span>TZ OFFSET</span>UTC${-new Date().getTimezoneOffset()/60 >= 0?'+':'-'}${Math.abs(new Date().getTimezoneOffset()/60)}</div>
      <div class="sys-rd"><span>LOCALE</span>${navigator.language||'en-US'}</div>
      <hr class="sys-hr">
      <div class="sys-rd"><span>STATUS</span><span style="color:var(--accent)">NOMINAL</span></div>
      <div class="sys-rd"><span>BUILD</span>MERIDIAN 2.0</div>
    `;
  }
  setInterval(update,2500); update();
}
initSys();

/* ══════════════════════════════════════════════════════════
   THEME SWITCHER
══════════════════════════════════════════════════════════ */
const THEMES={
  teal:  {accent:'#00D2B9',glow:'rgba(0,210,185,0.28)',a2:'#FF4B6E',a3:'#FFB020',a4:'#7B6FE8'},
  amber: {accent:'#FFB020',glow:'rgba(255,176,32,0.28)',a2:'#FF4B6E',a3:'#00D2B9',a4:'#7B6FE8'},
  violet:{accent:'#9B8FFF',glow:'rgba(155,143,255,0.28)',a2:'#FF4B6E',a3:'#FFB020',a4:'#00D2B9'},
  rose:  {accent:'#FF6B8A',glow:'rgba(255,107,138,0.28)',a2:'#FF4B6E',a3:'#FFB020',a4:'#7B6FE8'},
};
document.querySelectorAll('.thm-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.thm-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const t=THEMES[btn.dataset.theme];
    if(!t)return;
    const r=document.documentElement.style;
    r.setProperty('--accent',t.accent);
    r.setProperty('--accent-glow',t.glow);
    r.setProperty('--a2',t.a2);
    r.setProperty('--a3',t.a3);
    r.setProperty('--a4',t.a4);
    r.setProperty('--border','rgba('+hexToRgb(t.accent)+',0.22)');
    r.setProperty('--border-hi','rgba('+hexToRgb(t.accent)+',0.65)');
  });
});
function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}
